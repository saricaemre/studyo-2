    <script>
      gsap.registerPlugin(MotionPathPlugin);
      // Tohumlu rastgelelik (kare deterministik): mulberry32
      const rand = (s => () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; })(7);
      const NS = "http://www.w3.org/2000/svg";
      const yazi = document.getElementById("yazi");
      yazi.innerHTML = yazi.textContent.split(" ").map(k => `<span class="k">${k}</span>`).join(" ");
      const ham = MotionPathPlugin.getRawPath("#yol");
      MotionPathPlugin.cacheRawPathMeasurements(ham);
      const noktalar = [];
      for (let i = 1; i <= 22; i++) {
        const p = MotionPathPlugin.getPositionOnPath(ham, i / 23);
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", p.x.toFixed(1)); c.setAttribute("cy", p.y.toFixed(1)); c.setAttribute("r", "6");
        document.getElementById("iz").appendChild(c); noktalar.push(c);
      }
      const renkler = ["#FF5C7A", "#FFD25A", "#3FA34D", "#22ABE6", "#FF9BB0", "#9B7BE0"];
      const parcalar = [];
      for (let i = 0; i < 18; i++) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", "-7"); r.setAttribute("y", "-4"); r.setAttribute("width", "14"); r.setAttribute("height", "8"); r.setAttribute("rx", "3");
        r.setAttribute("fill", renkler[i % renkler.length]);
        document.getElementById("konfeti").appendChild(r);
        const a = -Math.PI * (0.1 + 0.8 * rand()), h = 140 + 160 * rand();
        parcalar.push({ r, x: 862 + Math.cos(a) * h, y: 520 + Math.sin(a) * h + 60, d: 200 + 400 * rand() });
      }
      const tl = gsap.timeline({ paused: true });
      // Altyazı kelime kelime: yaylanarak gelir, satır baştan yerleşik
      tl.fromTo("#yazi .k", { scale: 0.5, y: 24, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.08 }, 0.05);
      tl.to("#bulut1", { x: 40, duration: 3, ease: "none" }, 0).to("#bulut2", { x: -30, duration: 3, ease: "none" }, 0);
      tl.to("#isinlar", { rotation: 30, svgOrigin: "150 300", duration: 3, ease: "none" }, 0);
      tl.to("#agac", { rotation: 2, svgOrigin: "614 812", duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      // Düğmeye basılır, kalp doğar (ezilme-uzama)
      tl.to("#bagis", { scale: 0.9, duration: 0.1, ease: "power2.in" }, 0.25).to("#bagis", { scale: 1, duration: 0.35, ease: "back.out(3)" }, 0.35);
      tl.set("#kalp", { x: 250, y: 830 }, 0);
      tl.fromTo("#kalp-govde", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 0.38);
      tl.fromTo("#kalp-govde", { scaleX: 1.25, scaleY: 0.78 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "elastic.out(1, 0.5)" }, 0.62);
      // Kanatlar çırpar (sonlu tekrar)
      tl.fromTo("#kanat-sol", { rotation: 0 }, { rotation: -24, svgOrigin: "-40 8", duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 15 }, 0.5);
      tl.fromTo("#kanat-sag", { rotation: 0 }, { rotation: 24, svgOrigin: "40 8", duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 15 }, 0.5);
      // Eğri yolda uçuş, arkasında noktalı iz
      tl.to("#kalp", { motionPath: { path: "#yol" }, duration: 1.3, ease: "power1.inOut" }, 0.8);
      tl.fromTo("#kalp-govde", { rotation: -12 }, { rotation: 12, duration: 0.65, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.8);
      tl.fromTo(noktalar, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.15, ease: "back.out(3)", stagger: 1.25 / 22 }, 0.82);
      // Varış: ezilir, pencereler yanar, konfeti
      tl.to("#kalp-govde", { rotation: 0, scaleX: 1.22, scaleY: 0.8, duration: 0.1, ease: "power2.out" }, 2.1)
        .to("#kalp-govde", { scaleX: 1, scaleY: 1, duration: 0.45, ease: "elastic.out(1, 0.45)" }, 2.2);
      tl.to(".pencere", { fill: "#FFD25A", duration: 0.2, stagger: 0.08 }, 2.14);
      tl.set("#konfeti", { opacity: 1 }, 2.15);
      for (const p of parcalar) {
        tl.fromTo(p.r, { x: 862, y: 520, rotation: 0 }, { x: p.x, y: p.y, rotation: p.d, duration: 0.8, ease: "power3.out", immediateRender: false }, 2.15);
        tl.to(p.r, { y: p.y + 70, opacity: 0, duration: 0.5, ease: "power1.in" }, 2.6);
      }
      // Göz kırpma
      tl.to("#gozler", { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.06, yoyo: true, repeat: 1 }, 2.6);
      window.__timelines["main"] = tl;
    </script>
