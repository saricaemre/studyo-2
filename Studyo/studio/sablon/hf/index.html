<!doctype html>
<html lang="{{DIL}}" data-format="{{FORMAT}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>{{BASLIK}}</title>
    <script src="assets/lib/gsap/gsap.min.js"></script>
    <script src="assets/lib/gsap/MotionPathPlugin.min.js"></script>
    <style id="st-gorunus"></style>
    <script id="st-veri"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--arka); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--murekkep); font-family: var(--yazi-govde); }
      .clip { position: absolute; inset: 0; overflow: hidden; }

      /* Kanca */
      #kanca-baslik { position: absolute; left: 8%; right: 8%; top: 38%; font-size: 120px; line-height: 1; color: var(--murekkep); }
      #kanca-vurgu { color: var(--vurgu); }
      /* Formatlar ayrı kompozisyondur: yerleşimi formata göre kur, merkezden kırpma */
      html[data-format="9x16"] #kanca-baslik { top: 30%; font-size: 110px; }
      html[data-format="1x1"] #kanca-baslik { font-size: 100px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="{{W}}" data-height="{{H}}">
      <section id="s-kanca" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <h1 id="kanca-baslik" class="yazi-baslik">{{BASLIK}} <span id="kanca-vurgu">·</span></h1>
      </section>
      <audio id="st-ses" src="assets/ses/miks.wav" data-start="0" data-duration="10" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      // Zaman yalnız stüdyonun işaretlerinden: ST.isaretler.<ad> (saniye), ST.vuruslar, ST.kelimeler. Elle saniye yazma (CLAUDE.md kural 9).
      const ST = window.ST, I = ST.isaretler;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kanca-baslik", { y: 30, scale: 0.94 }, { y: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0); // ilk kare boş olmaz
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
